[project]
name = "tdd-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ioannis Nikolaou", email = "ioxnikolaou@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
tdd-agent = "tdd_agent:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]
eval = [
    "beautifulsoup4>=4.15.0",
    "gensim>=4.4.0",
    "nltk>=3.10.4",
    "numpy<2",
    "openpyxl>=3.1.5",
    "pandas<3",
    "pillow>=13.0.0",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "reportlab>=5.1.0",
]

[tool.ruff.lint]
select = ["E", "F", "I"]   # E = style errors, F = real bugs (unused imports, undefined names), I = import order
